    </g>
    <g id="petal-small">
      <path d="M200 110 C 212 140, 212 170, 200 200 C 188 170, 188 140, 200 110 Z"
            fill="none" stroke="currentColor" stroke-width="1.5"/>
    </g>
  </defs>
  <g stroke="currentColor" fill="none">
    <circle cx="200" cy="200" r="190" stroke-width="2"/>
    <circle cx="200" cy="200" r="160" stroke-width="1"/>
    <circle cx="200" cy="200" r="120" stroke-width="1"/>
    <circle cx="200" cy="200" r="80"  stroke-width="1"/>
    <circle cx="200" cy="200" r="40"  stroke-width="1.5"/>
    <circle cx="200" cy="200" r="14"  stroke-width="1.5" fill="currentColor"/>
  </g>
  <g>
    <use href="#petal"/>
    <use href="#petal" transform="rotate(30 200 200)"/>
    <use href="#petal" transform="rotate(60 200 200)"/>
