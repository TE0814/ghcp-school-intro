    <use href="#petal-small" transform="rotate(75 200 200)"/>
    <use href="#petal-small" transform="rotate(105 200 200)"/>
    <use href="#petal-small" transform="rotate(135 200 200)"/>
    <use href="#petal-small" transform="rotate(165 200 200)"/>
